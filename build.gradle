plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish' version '0.37.0'
    id 'com.palantir.git-version' version '5.1.0'
}

def gitDetails = versionDetails()
def isSnapshot = !gitDetails.isCleanTag

group = 'io.github.pesegato'
//version = gitVersion()

// Se siamo su un tag pulito → versione normale
// Altrimenti → versione-SNAPSHOT
version = isSnapshot
        ? "${gitDetails.lastTag}-SNAPSHOT"
        : gitDetails.lastTag

println("version : '${version}'  (snapshot: ${isSnapshot})")

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}
// =====================================================
// GitHub Packages
// =====================================================
publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Pesegato/Jungle")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

// =====================================================
// Maven Central (solo per le release stabili)
// =====================================================
mavenPublishing {
    publishToMavenCentral(true)   // true = rilascia automaticamente
    signAllPublications()

    coordinates(group.toString(), 'jungle', version.toString())

    pom {
        name = 'Jungle'
        description = 'Environment support for jMonkeyEngine.'
        url = 'https://github.com/Pesegato/Jungle/'
        inceptionYear = '2022'

        licenses {
            license {
                name = 'BSD 3-Clause License'
                url = 'https://github.com/Pesegato/Jungle/blob/main/LICENSE'
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'pesegato'
                name = 'Pesegato Ameiurus Melas'
                email = 'pesegato@outlook.com'
            }
        }

        scm {
            connection = 'scm:git:git://github.com/Pesegato/Jungle.git'
            developerConnection = 'scm:git:ssh://git@github.com/Pesegato/Jungle.git'
            url = 'https://github.com/Pesegato/Jungle/'
        }
    }
}

ext {
    javaVersion = JavaVersion.current()
    jmeVersion = "3.6.1-stable"   // meglio una versione fissa invece di [3.3,)
}

dependencies {
    implementation "org.jmonkeyengine:jme3-lwjgl3:$jmeVersion"
    implementation 'com.github.oshi:oshi-core:6.4.8'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-core:1.5.34'
    implementation 'ch.qos.logback:logback-classic:1.5.34'   // aggiunto il binding

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

test {
    useJUnitPlatform()
}